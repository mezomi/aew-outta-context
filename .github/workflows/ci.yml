name: CI

on:
  push:
    branches: ["**"]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    name: Test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install
        run: python -m pip install -e ".[dev]"
      - name: Lint
        run: |
          ruff check src tests
          ruff format --check src tests
      - name: Type check
        run: mypy src
      - name: Unit tests
        run: pytest --cov --cov-report=term
      - name: Integration tests (real ffmpeg + yt-dlp)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg
          pytest -m integration

  build-exe:
    name: Build outta.exe
    needs: test
    runs-on: windows-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install
        run: python -m pip install . pyinstaller
      - name: Build
        run: python packaging/build_exe.py
      - name: Smoke test
        shell: pwsh
        run: |
          .\dist\outta.exe --version
          .\dist\outta.exe --help
          .\dist\outta.exe config show
          .\dist\outta.exe episode status
          .\dist\outta.exe doctor --no-storage; if ($LASTEXITCODE -gt 1) { exit $LASTEXITCODE }
          $global:LASTEXITCODE = 0
      - uses: actions/upload-artifact@v4
        with:
          name: outta-windows
          path: dist/outta.exe
      - name: Read version
        id: version
        shell: bash
        run: echo "version=$(python -c "import tomllib;print(tomllib.load(open('pyproject.toml','rb'))['project']['version'])")" >> "$GITHUB_OUTPUT"
      - name: Publish release
        # Tags publish their own release; the main and working branches keep v<version> up to date,
        # so releases/latest/download/outta.exe is always the newest build.
        if: startsWith(github.ref, 'refs/tags/v') || github.ref == 'refs/heads/main' || github.ref == 'refs/heads/claude/outta-context-cli'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ startsWith(github.ref, 'refs/tags/v') && github.ref_name || format('v{0}', steps.version.outputs.version) }}
          target_commitish: ${{ github.sha }}
          name: outta ${{ steps.version.outputs.version }}
          make_latest: true
          overwrite_files: true
          body: |
            Install or update on Windows (PowerShell):

                irm https://github.com/mezomi/aew-outta-context/releases/latest/download/install.ps1 | iex

            Built from ${{ github.sha }}.
          files: |
            dist/outta.exe
            install.ps1
